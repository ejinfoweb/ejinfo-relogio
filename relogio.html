<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a1628;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(20,60,130,0.4) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(10,30,80,0.6) 0%, transparent 70%);
    pointer-events: none;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    animation: twinkle var(--d, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.8; }
  }

  .container {
    text-align: center;
    z-index: 1;
    padding: 2rem;
  }

  .header {
    margin-bottom: 1.5rem;
  }

  .dia-semana {
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: rgba(180, 210, 255, 0.7);
    text-transform: uppercase;
    letter-spacing: 0.3em;
    margin-bottom: 0.3rem;
  }

  .data-completa {
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: rgba(140, 180, 255, 0.6);
    letter-spacing: 0.15em;
  }

  .hora {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 22vw, 14rem);
    color: #FFD700;
    line-height: 0.9;
    letter-spacing: 0.02em;
    text-shadow:
      0 0 40px rgba(255, 215, 0, 0.3),
      0 0 80px rgba(255, 215, 0, 0.1);
    animation: pulse-clock 1s ease-in-out infinite;
    position: relative;
  }

  @keyframes pulse-clock {
    0%, 100% { text-shadow: 0 0 40px rgba(255,215,0,0.3), 0 0 80px rgba(255,215,0,0.1); }
    50% { text-shadow: 0 0 60px rgba(255,215,0,0.5), 0 0 100px rgba(255,215,0,0.2); }
  }

  .hora .colon {
    animation: blink 1s step-end infinite;
    display: inline-block;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .periodo {
    margin-top: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
  }

  .periodo-icon {
    font-size: 2.2rem;
  }

  .periodo-texto {
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: clamp(1.8rem, 5vw, 3rem);
    color: rgba(180, 210, 255, 0.65);
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  .water-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 50px;
    padding: 6px 16px 6px 10px;
    z-index: 1;
  }

  .water-bar-label {
    font-size: 11px;
    color: rgba(140,180,255,0.5);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .water-bar-next {
    font-size: 12px;
    font-weight: 600;
    color: rgba(180, 210, 255, 0.7);
    letter-spacing: 0.05em;
  }

  .water-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4a9eff;
    opacity: 0.5;
  }

  .clima-bar {
    position: fixed;
    top: 20px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 50px;
    padding: 7px 18px 7px 12px;
    z-index: 1;
  }

  .clima-temp {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    color: #FFD700;
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .clima-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .clima-desc {
    font-size: 11px;
    color: rgba(180, 210, 255, 0.7);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .clima-umid {
    font-size: 10px;
    color: rgba(140, 180, 255, 0.45);
    letter-spacing: 0.06em;
  }

  .clima-icon {
    font-size: 1.5rem;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 10, 30, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .alert-box {
    background: linear-gradient(135deg, #0d2b5e 0%, #0a1628 100%);
    border: 1px solid rgba(74, 158, 255, 0.4);
    border-radius: 20px;
    padding: 3rem 3.5rem;
    text-align: center;
    max-width: 440px;
    width: 90%;
    box-shadow: 0 0 60px rgba(74, 158, 255, 0.15), 0 0 120px rgba(74, 158, 255, 0.05);
    animation: alert-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes alert-in {
    from { transform: scale(0.8) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .alert-water-icon {
    font-size: 4rem;
    margin-bottom: 0.8rem;
    animation: water-bounce 1s ease-in-out infinite;
  }

  @keyframes water-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .alert-atencao {
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(74, 158, 255, 0.7);
    margin-bottom: 0.5rem;
  }

  .alert-titulo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.2rem;
    color: #FFD700;
    letter-spacing: 0.05em;
    line-height: 1;
    margin-bottom: 0.7rem;
    text-shadow: 0 0 30px rgba(255,215,0,0.3);
  }

  .alert-sub {
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: 1rem;
    color: rgba(180, 210, 255, 0.6);
    margin-bottom: 2.2rem;
    line-height: 1.5;
  }

  .alert-waves {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 2rem;
  }

  .wave {
    width: 6px;
    height: 24px;
    background: rgba(74, 158, 255, 0.4);
    border-radius: 3px;
    animation: wave-anim 1s ease-in-out infinite;
  }

  .wave:nth-child(2) { animation-delay: 0.15s; }
  .wave:nth-child(3) { animation-delay: 0.3s; }
  .wave:nth-child(4) { animation-delay: 0.45s; }
  .wave:nth-child(5) { animation-delay: 0.6s; }

  @keyframes wave-anim {
    0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  .btn-ok {
    background: transparent;
    border: 3px solid #FFD700;
    color: #FFD700;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 1rem 5rem;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
    width: 100%;
    text-shadow: 0 0 20px rgba(255,215,0,0.3);
  }

  .btn-ok::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 215, 0, 0);
    transition: background 0.2s ease;
    border-radius: 50px;
  }

  .btn-ok:hover {
    color: #0a1628;
    border-color: #FFD700;
    transform: scale(1.03);
  }

  .btn-ok:hover::before {
    background: #FFD700;
  }

  .btn-ok:active { transform: scale(0.97); }

  .btn-ok span { position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="clima-bar">
  <span class="clima-icon" id="climaIcon">🌡️</span>
  <span class="clima-temp" id="climaTemp">--°</span>
  <div class="clima-info">
    <span class="clima-desc" id="climaDesc">Carregando...</span>
    <span class="clima-umid" id="climaUmid">Rio de Janeiro</span>
  </div>
</div>

<div class="container">
  <div class="header">
    <div class="dia-semana" id="diaSemana"></div>
    <div class="data-completa" id="dataCompleta"></div>
  </div>

  <div class="hora" id="hora">
    <span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="colon">:</span><span id="ss">00</span>
  </div>

  <div class="periodo">
    <span class="periodo-icon" id="periodoIcon">🌤️</span>
    <span class="periodo-texto" id="periodoTexto">Manhã</span>
  </div>
</div>

<div class="water-bar">
  <div class="water-dot"></div>
  <span class="water-bar-label">Próxima água:</span>
  <span class="water-bar-next" id="proxAgua">--:--</span>

</div>

<!-- OVERLAY ÁGUA -->
<div class="overlay" id="overlay">
  <div class="alert-box">
    <div class="alert-water-icon">💧</div>
    <div class="alert-atencao">⚠ Atenção</div>
    <div class="alert-titulo">Beber Água!</div>
    <div class="alert-sub">Está na hora de se hidratar.<br>Beba pelo menos um copo d'água agora.</div>
    <div class="alert-waves">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
    <button class="btn-ok" onclick="fecharAlerta()">
      <span>✓ &nbsp; OK</span>
    </button>
    <div style="margin-top:1.5rem;">
      <div style="font-size:0.7rem;color:rgba(140,180,255,0.4);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:6px;">Fecha automaticamente em 10 min</div>
      <div style="background:rgba(255,255,255,0.07);border-radius:50px;height:3px;overflow:hidden;">
        <div id="progresso" style="height:100%;background:rgba(74,158,255,0.5);border-radius:50px;width:100%;"></div>
      </div>
    </div>
  </div>
</div>

<!-- OVERLAY REMÉDIO -->
<div class="overlay" id="overlay-remedio">
  <div class="alert-box" style="border-color:rgba(100,220,130,0.4);box-shadow:0 0 60px rgba(80,200,100,0.15),0 0 120px rgba(80,200,100,0.05);">
    <div class="alert-water-icon">💊</div>
    <div class="alert-atencao" style="color:rgba(100,220,130,0.8);">⚠ Atenção</div>
    <div class="alert-titulo" style="color:#7fffaa;text-shadow:0 0 30px rgba(127,255,170,0.3);">Hora do Remédio!</div>
    <div id="remedio-lista" style="margin:1rem 0 1.5rem;text-align:left;"></div>
    <button class="btn-ok" onclick="fecharRemedio()" style="border-color:#7fffaa;color:#7fffaa;text-shadow:0 0 20px rgba(127,255,170,0.3);">
      <span>✓ &nbsp; OK</span>
    </button>
    <div style="margin-top:1.5rem;">
      <div style="font-size:0.7rem;color:rgba(140,255,180,0.3);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:6px;">Fecha automaticamente em 10 min</div>
      <div style="background:rgba(255,255,255,0.07);border-radius:50px;height:3px;overflow:hidden;">
        <div id="progresso-remedio" style="height:100%;background:rgba(80,200,100,0.5);border-radius:50px;width:100%;"></div>
      </div>
    </div>
  </div>
</div>

<script>


  const diasSemana = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

  const HORA_INICIO = 10;
  const HORA_FIM = 21;
  const TIMEOUT_ALERTA_MS = 10 * 60 * 1000;

  let alertaAberto = false;
  let ultimoAlerta = null;
  let timerFechamento = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function getPeriodo(h) {
    if (h >= 5 && h < 12)  return { texto: 'Manhã',    icon: '🌤️' };
    if (h >= 12 && h < 18) return { texto: 'Tarde',    icon: '☀️' };
    if (h >= 18 && h < 24) return { texto: 'Noite',    icon: '🌙' };
    return                         { texto: 'Madrugada', icon: '🌌' };
  }

  function horarioAtivo(h) {
    return h >= HORA_INICIO && h < HORA_FIM;
  }

  function proximoAlerta(now) {
    const h = now.getHours(), m = now.getMinutes();
    for (let i = HORA_INICIO; i < HORA_FIM; i += 2) {
      if (i > h || (i === h && 15 > m)) {
        return `${pad(i)}:15`;
      }
    }
    return `${pad(HORA_INICIO)}:15 (amanhã)`;
  }

  // Configuração dos remédios por horário
  const REMEDIOS = {
    '17:00': [
      { nome: 'Remedio01', qtd: '1 comprimido' },
      { nome: 'Remedio02', qtd: '1 comprimido' },
    ],
    '19:00': [
      { nome: 'Remedio01', qtd: '1 comprimido' },
      { nome: 'Remedio02', qtd: '1 comprimido' },
      { nome: 'Remedio03', qtd: '2 comprimidos' },
    ],
  };

  let ultimoRemedio = null;
  let timerFechamentoRemedio = null;
  let remedioAberto = false;

  function deveAlertar(now) {
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    if (!horarioAtivo(h)) return false;
    if (h % 2 === 0 && m === 15 && s === 0) {
      const chave = `${h}:${m}`;
      if (ultimoAlerta !== chave) {
        ultimoAlerta = chave;
        return true;
      }
    }
    return false;
  }

  function deveAvisarRemedio(now) {
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    if (s !== 0) return null;
    const chave = `${pad(h)}:${pad(m)}`;
    if (REMEDIOS[chave] && ultimoRemedio !== chave) {
      ultimoRemedio = chave;
      return REMEDIOS[chave];
    }
    return null;
  }

  let loopVoz = false;

  function falarTexto(texto) {
    if (!window.speechSynthesis) return;
    loopVoz = false;
    window.speechSynthesis.cancel();
    const falar = () => {
      const msg = new SpeechSynthesisUtterance(texto);
      msg.lang = 'pt-BR';
      msg.rate = 0.92;
      msg.pitch = 1.05;
      msg.volume = 1;
      const vozes = window.speechSynthesis.getVoices();
      const ptBR = vozes.find(v => v.lang === 'pt-BR') || vozes.find(v => v.lang.startsWith('pt')) || null;
      if (ptBR) msg.voice = ptBR;
      window.speechSynthesis.speak(msg);
    };
    if (window.speechSynthesis.getVoices().length > 0) { falar(); }
    else { window.speechSynthesis.onvoiceschanged = falar; }
  }

  function falarAgua() { falarTexto('Atenção: Hora de beber água!'); }

  function falarRemedio(lista) {
    const nomes = lista.map(r => `${r.nome}, ${r.qtd}`).join('. ');
    falarTexto(`Atenção: Hora do remédio! ${nomes}`);
  }

  function pararVoz() {
    loopVoz = false;
    window.speechSynthesis && window.speechSynthesis.cancel();
  }

  function fecharRemedio() {
    if (timerFechamentoRemedio) { clearTimeout(timerFechamentoRemedio); timerFechamentoRemedio = null; }
    window.speechSynthesis && window.speechSynthesis.cancel();
    document.getElementById('overlay-remedio').classList.remove('show');
    document.getElementById('progresso-remedio').style.width = '100%';
    remedioAberto = false;
  }

  function abrirRemedio(lista) {
    remedioAberto = true;
    // Monta lista visual
    const el = document.getElementById('remedio-lista');
    el.innerHTML = lista.map(r => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:6px;background:rgba(127,255,170,0.06);border:0.5px solid rgba(127,255,170,0.2);border-radius:10px;">
        <span style="font-size:1.3rem;">💊</span>
        <div>
          <div style="font-family:'Barlow',sans-serif;font-weight:600;font-size:1rem;color:#7fffaa;letter-spacing:0.05em;">${r.nome}</div>
          <div style="font-family:'Barlow',sans-serif;font-weight:300;font-size:0.85rem;color:rgba(180,255,210,0.6);">${r.qtd}</div>
        </div>
      </div>`).join('');
    falarRemedio(lista);
    document.getElementById('overlay-remedio').classList.add('show');
    document.getElementById('progresso-remedio').style.transition = 'none';
    document.getElementById('progresso-remedio').style.width = '100%';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.getElementById('progresso-remedio').style.transition = `width ${TIMEOUT_ALERTA_MS}ms linear`;
        document.getElementById('progresso-remedio').style.width = '0%';
      });
    });
    timerFechamentoRemedio = setTimeout(fecharRemedio, TIMEOUT_ALERTA_MS);
  }

  function fecharAlerta() {
    if (timerFechamento) { clearTimeout(timerFechamento); timerFechamento = null; }
    window.speechSynthesis && window.speechSynthesis.cancel();
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('progresso').style.width = '100%';
    alertaAberto = false;
  }

  function abrirAlerta() {
    alertaAberto = true;
    falarAgua();
    document.getElementById('overlay').classList.add('show');
    document.getElementById('progresso').style.transition = 'none';
    document.getElementById('progresso').style.width = '100%';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.getElementById('progresso').style.transition = `width ${TIMEOUT_ALERTA_MS}ms linear`;
        document.getElementById('progresso').style.width = '0%';
      });
    });
    timerFechamento = setTimeout(() => {
      fecharAlerta();
    }, TIMEOUT_ALERTA_MS);
  }

  function tick() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const diaSem = now.getDay(), dia = now.getDate(), mes = now.getMonth(), ano = now.getFullYear();

    document.getElementById('hh').textContent = pad(h);
    document.getElementById('mm').textContent = pad(m);
    document.getElementById('ss').textContent = pad(s);

    document.getElementById('diaSemana').textContent = diasSemana[diaSem];
    document.getElementById('dataCompleta').textContent = `${pad(dia)} / ${pad(mes+1)} / ${ano}`;

    const p = getPeriodo(h);
    document.getElementById('periodoTexto').textContent = p.texto;
    document.getElementById('periodoIcon').textContent = p.icon;

    const proxEl = document.getElementById('proxAgua');
    if (horarioAtivo(h)) {
      proxEl.textContent = proximoAlerta(now);
      proxEl.style.opacity = '1';
    } else {
      proxEl.textContent = `${pad(HORA_INICIO)}:15`;
      proxEl.style.opacity = '0.4';
    }

    if (!alertaAberto && deveAlertar(now)) {
      abrirAlerta();
    }

    const listaRemedio = deveAvisarRemedio(now);
    if (!remedioAberto && listaRemedio) {
      abrirRemedio(listaRemedio);
    }
  }

  // Mapa de código de clima -> ícone + descrição
  const WMO = {
    0:  ['☀️','Céu limpo'],
    1:  ['🌤️','Poucas nuvens'],
    2:  ['⛅','Parcialmente nublado'],
    3:  ['☁️','Nublado'],
    45: ['🌫️','Neblina'],
    48: ['🌫️','Neblina'],
    51: ['🌦️','Garoa leve'],
    53: ['🌦️','Garoa'],
    55: ['🌧️','Garoa forte'],
    61: ['🌧️','Chuva leve'],
    63: ['🌧️','Chuva'],
    65: ['🌧️','Chuva forte'],
    80: ['🌦️','Pancadas'],
    81: ['⛈️','Pancadas'],
    82: ['⛈️','Temporal'],
    95: ['⛈️','Trovoada'],
    96: ['⛈️','Trovoada c/ granizo'],
    99: ['⛈️','Trovoada c/ granizo'],
  };

  async function atualizarClima() {
    try {
      // Coordenadas do Rio de Janeiro - Tijuca
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=-22.9229&longitude=-43.2281&current=temperature_2m,relative_humidity_2m,weathercode&timezone=America%2FSao_Paulo';
      const res = await fetch(url);
      const data = await res.json();
      const cur = data.current;
      const temp = Math.round(cur.temperature_2m);
      const umid = cur.relative_humidity_2m;
      const code = cur.weathercode;
      const [icon, desc] = WMO[code] || ['🌡️', 'Tempo variável'];
      document.getElementById('climaTemp').textContent = temp + '°C';
      document.getElementById('climaDesc').textContent = desc;
      document.getElementById('climaUmid').textContent = `Umidade ${umid}%`;
      document.getElementById('climaIcon').textContent = icon;
    } catch(e) {
      document.getElementById('climaDesc').textContent = 'Sem dados';
    }
  }

  atualizarClima();
  setInterval(atualizarClima, 10 * 60 * 1000); // atualiza a cada 10 min

  function criarEstrelas() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--d', (2 + Math.random() * 4) + 's');
      s.style.setProperty('--delay', (Math.random() * 4) + 's');
      s.style.opacity = Math.random() * 0.6 + 0.1;
      container.appendChild(s);
    }
  }

  criarEstrelas();
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
